<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>任務目錄｜名古屋大阪 心動解鎖任務</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="missions">
  <div class="container">
    <div class="header">
      <div class="badge">只限 BB 查看｜心動密語加密頻道</div>
      <div style="height:12px"></div>
      <h1 class="h1">你的任務目錄</h1>
      <div class="sub">揀一日，輸入今日心動密語，就可以解鎖。</div>
      <div class="sub" style="margin-top:6px;">完成記錄會保存在同一部手機／瀏覽器。</div>
    </div>

    <div class="hr"></div>

    <div id="daysRoot" class="grid two"></div>

    <div class="hr"></div>

    <div class="card">
      <div class="row stack" style="justify-content:space-between;">
        <div>
          <div class="section-title">工具</div>
          <div class="sub">如果你想重新試玩（或測試解鎖動畫），可以重置記錄。</div>
        </div>
        <div class="row" style="justify-content:flex-end;">
          <button id="resetBtn" class="btn btn-primary">重置記錄</button>
        </div>
      </div>
    </div>

    <div style="height:18px"></div>
    <div class="sub" style="text-align:center;">— BB 專屬任務總監 FHL</div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
